name: Build Wave 1 Capital Advisory Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/capital/**"
      - "tests/funding*.test.mjs"
      - "tests/creditReportingPlan.test.mjs"
      - "tests/universalCapitalIntake.test.mjs"
      - ".github/workflows/build-wave-1-capital-advisory.yml"
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - name: Capital funding and credit reporting boundary tests
        run: node --experimental-strip-types --test tests/fundingAgents.test.mjs tests/fundingLifecycle.test.mjs tests/creditReportingPlan.test.mjs tests/universalCapitalIntake.test.mjs
      - name: Astro / TypeScript check
        run: npm run check
      - name: Production build
        run: npm run build
