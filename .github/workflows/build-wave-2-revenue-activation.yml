name: Wave 2 Revenue Activation
on:
  pull_request:
    paths:
      - "src/lib/command/revenueActivation.ts"
      - "tests/revenueActivation.test.mjs"
      - ".github/workflows/build-wave-2-revenue-activation.yml"
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --test tests/revenueActivation.test.mjs tests/enterpriseCommand.test.mjs tests/enterpriseWave1.test.mjs
