name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Astro and TypeScript
        run: npm run check

      - name: Run regression suite
        run: node --test tests/*.test.mjs

      # Reports outstanding photographs without treating missing rights as approved.
      # Fails on missing previously approved derivatives or SHA-256 tampering.
      - name: Audit expansion photography integrity
        run: npm run audit:expansion-photography

      - name: Verify Omega photography clearance queue
        run: npm run check:omega-photography:queue

      - name: Build production release
        run: npm run build
